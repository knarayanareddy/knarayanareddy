<svg xmlns="http://www.w3.org/2000/svg" width="423" height="258" viewBox="0 0 423 258" role="img" aria-label="AI-Arsenal live window: 1,598 entries">
  <defs>
    <clipPath id="view-clip"><rect x="1" y="26" width="421" height="196"/></clipPath>
    <linearGradient id="scan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0b1220" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0.10"/>
    </linearGradient>
    <style>
      @keyframes livePulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.25; }
      }
      .live-dot { animation: livePulse 1.8s ease-in-out infinite; }
      .live-dot-b { animation: livePulse 1.8s ease-in-out infinite; animation-delay: 0.9s; }
      @media (prefers-reduced-motion: reduce) {
        .live-dot, .live-dot-b { animation: none; }
        .scan { display: none; }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="422" height="257" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- url bar -->
  <path d="M0.5 26 V10.5 a10 10 0 0 1 10-10 H412.5 a10 10 0 0 1 10 10 V26 Z" fill="#f6f8fa"/>
  <line x1="0.5" y1="26" x2="422.5" y2="26" stroke="#d0d7de"/>
  <rect x="10" y="8" width="4" height="9" rx="2" fill="#cf222e" class="live-dot"/>
  <rect x="18" y="8" width="4" height="9" rx="2" fill="#57606a" opacity="0.55"/>
  <rect x="26" y="8" width="4" height="9" rx="2" fill="#57606a" opacity="0.35"/>
  <rect x="40" y="6.5" width="327" height="13" rx="6.5" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="46" y="11" width="3" height="4" rx="1" fill="#0969da" opacity="0.8"/>
  <text x="54" y="16.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#57606a">knarayanareddy.github.io/AI-Arsenal</text>
  <circle cx="382.4" cy="13" r="2.4" fill="#cf222e" class="live-dot-b"/>
  <text x="411" y="16.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="7.5" letter-spacing="0.6" fill="#cf222e" font-weight="bold">LIVE</text>

  <!-- viewport -->
  <g clip-path="url(#view-clip)">
    <image x="1" y="26" width="421" height="196" href="data:image/jpeg;base64," preserveAspectRatio="xMidYMin slice"/>
    <g class="scan">
      <rect x="-90" y="26" width="90" height="196" fill="url(#scan-grad)">
        <animate attributeName="x" values="-90;423" dur="6.5s" begin="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="1" y="188" width="421" height="34" fill="url(#fade-grad)"/>
  </g>

  <!-- caption -->
  <line x1="0.5" y1="222" x2="422.5" y2="222" stroke="#d0d7de"/>
  <rect x="10" y="231" width="3" height="16" rx="1.5" fill="url(#bar-grad)"/>
  <text x="20" y="243" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0d1117">AI-Arsenal</text>
  <text x="411" y="243" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#57606a">1,598 entries</text>
</svg>
